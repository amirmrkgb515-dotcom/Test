<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Question for You ❤️</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
    }
    .card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      padding: 35px 25px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 380px;
      width: 100%;
    }
    .hidden { display: none; }
    h2 { color: #d63384; font-size: 22px; margin-bottom: 20px; line-height: 1.4; }
    p { color: #4a4a4a; font-size: 17px; margin-bottom: 25px; line-height: 1.5; }
    .btn-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-top: 15px;
      min-height: 50px;
      position: relative;
    }
    button {
      padding: 12px 28px;
      font-size: 16px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s, transform 0.2s;
    }
    .btn-yes { background: #28a745; color: white; }
    .btn-yes:hover { background: #218838; transform: scale(1.05); }
    .btn-next { background: #d63384; color: white; width: 100%; margin-top: 10px; }
    .btn-next:hover { background: #c2185b; }
    .btn-no { background: #dc3545; color: white; white-space: nowrap; }
    
    .slider-container { margin: 20px 0; }
    input[type=range] {
      width: 100%;
      accent-color: #d63384;
      height: 8px;
      cursor: pointer;
    }
    .percentage { font-size: 32px; font-weight: 700; color: #d63384; margin-top: 10px; }
    .status-text { font-size: 15px; color: #666; margin-top: 8px; min-height: 22px; font-weight: 500; }
  </style>
</head>
<body>

  <!-- STEP 1 -->
  <div id="step1" class="card">
    <h2>Do you like me? 🙂😅</h2>
    <div class="btn-group">
      <button class="btn-yes" onclick="goToStep(2)">Yes! 💕</button>
      <button id="noBtn" class="btn-no">No ❌</button>
    </div>
  </div>

  <!-- STEP 2 -->
  <div id="step2" class="card hidden">
    <h2>I knew it! 😂😏</h2>
    <p>I mean... how could you not?</p>
    <button class="btn-next" onclick="goToStep(3)">Next ➡️</button>
  </div>

  <!-- STEP 3 -->
  <div id="step3" class="card hidden">
    <h2>How much do you like me? 🎚️</h2>
    <div class="slider-container">
      <input type="range" id="loveSlider" min="0" max="100" value="0" oninput="updateSlider(this.value)" onchange="snapToHundred()" onmouseup="snapToHundred()" ontouchend="snapToHundred()">
      <div class="percentage" id="sliderVal">0%</div>
      <div class="status-text" id="statusText">Drag to choose!</div>
    </div>
    <button class="btn-next" onclick="goToStep(4)">Submit 💖</button>
  </div>

  <!-- STEP 4 -->
  <div id="step4" class="card hidden">
    <h2>I didn't know it was this much! 😂😭</h2>
    <p>100%? That's impressive! 🙈</p>
    <button class="btn-next" onclick="goToStep(5)">One last thing... ❤️</button>
  </div>

  <!-- STEP 5 -->
  <div id="step5" class="card hidden">
    <h2>The feeling is mutual! 🥰</h2>
    <p>I like you too! ❤️✨</p>
  </div>

  <script>
    // Smart dodging No Button
    const noBtn = document.getElementById('noBtn');
    const noTexts = [
      "No ❌",
      "Nice try! 😜",
      "Not a chance! 🏃‍♂️",
      "Still missed! 😂",
      "Just click Yes! ❤️"
    ];
    let dodgeCount = 0;

    function dodge() {
      if (dodgeCount === 0) {
        noBtn.style.position = 'fixed';
      }
      dodgeCount++;
      const textIndex = Math.min(dodgeCount, noTexts.length - 1);
      noBtn.innerText = noTexts[textIndex];

      const padding = 20;
      const maxX = window.innerWidth - noBtn.offsetWidth - padding;
      const maxY = window.innerHeight - noBtn.offsetHeight - padding;

      const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
      const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

      noBtn.style.left = randomX + 'px';
      noBtn.style.top = randomY + 'px';
    }

    noBtn.addEventListener('mouseover', dodge);
    noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); dodge(); });

    // Step navigation
    function goToStep(stepNumber) {
      document.querySelectorAll('.card').forEach(card => card.classList.add('hidden'));
      document.getElementById('step' + stepNumber).classList.remove('hidden');
    }

    // Dynamic slider logic
    const slider = document.getElementById('loveSlider');
    const sliderVal = document.getElementById('sliderVal');
    const statusText = document.getElementById('statusText');

    function updateSlider(val) {
      sliderVal.innerText = val + '%';
      if (val < 30) {
        statusText.innerText = "Wait, really? 🤨";
      } else if (val < 70) {
        statusText.innerText = "Come on, you can do better! 😏";
      } else if (val < 100) {
        statusText.innerText = "Almost there... 😃";
      } else {
        statusText.innerText = "100%! Perfect! ❤️";
      }
    }

    function snapToHundred() {
      slider.value = 100;
      updateSlider(100);
    }
  </script>
</body>
</html>
